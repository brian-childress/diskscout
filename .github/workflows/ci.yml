name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and smoke test the CLI
        run: |
          python -m pip install .
          diskscout --version
          mkdir -p "$RUNNER_TEMP/proj/app/node_modules/x" && echo hi > "$RUNNER_TEMP/proj/app/node_modules/x/i.js"
          diskscout scan --only deps,dups,large --project-root "$RUNNER_TEMP/proj" --personal-root "$RUNNER_TEMP/proj" --out "$RUNNER_TEMP/reports"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
